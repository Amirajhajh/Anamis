<!DOCTYPE html>
{% load static %}
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Messenger - ثبت نام{% endblock %}</title>
    <!-- استفاده از فایل CSS اصلی شما -->
    <link rel="stylesheet" href="{% static 'css/accounts.css' %}">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <h2>ثبت نام با ایمیل</h2>
        <p>ایمیل خود را وارد کنید تا کد تأیید ارسال شود.</p>
        
        <!-- بخش پیام‌ها: دقیقاً مطابق با نام کلاس‌های فایل شما -->
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <form method="post" class="auth-form" id="registerForm">
            {% csrf_token %}
            
            <div class="input-group">
                <label for="email">ایمیل:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@gmail.com"
                    required
                >
            </div>

            <button type="submit" class="auth-btn" id="submitBtn">
                <span id="btnText">ارسال</span>
                <span id="btnLoader" style="display: none;">در حال ارسال...</span>
            </button>
        </form>
        
        <p class="login-link">قبلاً ثبت‌نام کرده‌اید؟ <a href="{% url 'login' %}">وارد شوید</a></p>
    </div>
</div>

<script>
    // جلوگیری از ارسال چندباره فرم
    const form = document.getElementById('registerForm');
    const btn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnLoader = document.getElementById('btnLoader');

    form.onsubmit = function() {
        btn.disabled = true; // غیرفعال کردن دکمه
        btnText.style.display = 'none'; // مخفی کردن متن اصلی
        btnLoader.style.display = 'inline'; // نمایش متن در حال ارسال
    };
</script>

</body>
</html>
