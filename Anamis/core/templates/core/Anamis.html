```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anamis | پیام‌رسان آنلاین</title>

    <meta name="description" content="Anamis یک پیام‌رسان آنلاین برای گفتگو و ارتباط با دوستان است.">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Tahoma, sans-serif;
            background:linear-gradient(135deg,#0f172a,#1e293b);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .container{
            width:100%;
            max-width:700px;
            background:#fff;
            border-radius:24px;
            padding:50px;
            text-align:center;
            box-shadow:0 20px 50px rgba(0,0,0,.25);
        }

        h1{
            color:#0f172a;
            font-size:48px;
            margin-bottom:15px;
        }

        p{
            color:#64748b;
            line-height:2;
            margin-bottom:35px;
        }

        .buttons{
            display:flex;
            justify-content:center;
            gap:15px;
            flex-wrap:wrap;
        }

        .btn{
            text-decoration:none;
            padding:14px 32px;
            border-radius:12px;
            font-size:16px;
            font-weight:bold;
            transition:0.3s;
        }

        .login{
            background:#2563eb;
            color:white;
        }

        .login:hover{
            background:#1d4ed8;
        }

        .register{
            background:#e2e8f0;
            color:#0f172a;
        }

        .register:hover{
            background:#cbd5e1;
        }

        .features{
            margin-top:40px;
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
            gap:15px;
        }

        .feature{
            background:#f8fafc;
            padding:15px;
            border-radius:12px;
        }

        .feature h3{
            margin-bottom:8px;
            color:#0f172a;
        }

        .feature p{
            margin:0;
            font-size:14px;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>Anamis</h1>

    <p>
        به پیام‌رسان Anamis خوش آمدید.
        با دوستان خود گفتگو کنید، پیام ارسال کنید و همیشه در ارتباط بمانید.
    </p>

    <div class="buttons">
        <a href="{% url 'core:login' %}" class="btn login">
         ورود
        </a>
        <a href="{% url 'register_step1' %}" class="btn register">
            ثبت نام
        </a>
    </div>

    <div class="features">
        <div class="feature">
            <h3>چت سریع</h3>
            <p>ارسال و دریافت پیام در لحظه</p>
        </div>

        <div class="feature">
            <h3>امنیت بالا</h3>
            <p>حفاظت از اطلاعات کاربران</p>
        </div>

        <div class="feature">
            <h3>رابط کاربری ساده</h3>
            <p>استفاده آسان در موبایل و دسکتاپ</p>
        </div>
    </div>

</div>

</body>
</html>
